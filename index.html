<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break-Even Calculator</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#16202e;--mut:#5d6b7e;--line:#d9e0ea;--acc:#1457b8;--accbg:#e6effb;--tr:#0d7a53;--tc:#c2371d;--resbg:#e8f4ee}
@media(prefers-color-scheme:dark){:root{--bg:#10161f;--card:#18212d;--ink:#e6ebf2;--mut:#9aa8bb;--line:#2a3646;--acc:#7db0ff;--accbg:#1c2d48;--tr:#4cd39b;--tc:#ff8a73;--resbg:#173328}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-color-scheme:dark){.tabs button[aria-selected=true]{color:#0a1626}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:.9rem;font-weight:600}
label small{display:block;font-weight:400;color:var(--mut)}
input{width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
h2{font-size:1.05rem;margin:0 0 10px}
.opt{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.opt p{margin:0 0 8px;color:var(--mut);font-size:.9rem}
.row{display:flex;gap:8px;margin-top:14px}
.row button{padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.step{border-left:4px solid var(--acc);padding:4px 0 4px 14px;margin:0 0 18px}
.step h3{font-size:1rem;margin:0 0 6px}
.eq{font:1rem/1.7 Cambria,"Cambria Math",Georgia,serif;overflow-wrap:anywhere}
.res{display:inline-block;margin:4px 0;padding:3px 10px;background:var(--resbg);border-radius:6px;font:600 1rem Cambria,"Cambria Math",Georgia,serif}
.note{color:var(--mut);font-size:.92rem;margin:2px 0}
.msg{color:var(--mut)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mut);font:11px system-ui,sans-serif}
.gl{stroke:var(--line)}
.ln{fill:none;stroke-width:2.5}
.trl{stroke:var(--tr)}.tcl{stroke:var(--tc)}
</style>
</head>
<body>
<main>
<h1>Break-Even Calculator for BSIS-32</h1>
<p class="sub">Linear and non-linear break-even analysis with a full step-by-step solution.</p>

<div class="tabs" role="tablist">
<button role="tab" id="t1" aria-selected="true">Linear</button>
<button role="tab" id="t2" aria-selected="false">Non-linear</button>
</div>

<section id="p1" class="card">
<h2>Linear: constant selling price</h2>
<div class="grid">
<label>Selling price per unit<input id="lp" type="number" step="any" value="15"></label>
<label>Variable cost per unit<input id="lv" type="number" step="any" value="10"></label>
<label>Fixed cost<input id="lf" type="number" step="any" value="6000"></label>
</div>
<div class="opt">
<p>Optional questions (leave blank to skip)</p>
<div class="grid">
<label>Units sold<small>find the profit</small><input id="lu" type="number" step="any" value="500"></label>
<label>Target profit<small>find the units needed</small><input id="lt" type="number" step="any" value="8000"></label>
<label>Break-even at this many units<small>find the new VC, price, or FC</small><input id="ln" type="number" step="any" value="500"></label>
</div>
</div>
<div class="row"><button type="button" data-clear="p1">Clear</button></div>
</section>

<section id="p2" class="card" hidden>
<h2>Non-linear: price drops as units sold increase</h2>
<div class="grid">
<label>Starting price per unit (a)<input id="na" type="number" step="any" value="12"></label>
<label>Price drop per unit sold (b)<small>price = a − bx</small><input id="nb" type="number" step="any" value="0.1"></label>
<label>Variable cost per unit<input id="nv" type="number" step="any" value="7"></label>
<label>Fixed cost<input id="nf" type="number" step="any" value="40"></label>
</div>
<div class="opt">
<p>Optional questions (leave blank to skip)</p>
<div class="grid">
<label>Units sold<small>find the profit</small><input id="nu" type="number" step="any" value="50"></label>
<label>Target profit<small>find the units needed</small><input id="nt" type="number" step="any"></label>
</div>
</div>
<div class="row"><button type="button" data-clear="p2">Clear</button></div>
</section>

<section class="card" id="gcard" hidden><h2>Graph</h2><div id="chart"></div></section>
<section class="card"><h2>Solution</h2><div id="out"></div></section>
</main>

<script>
const $=id=>document.getElementById(id);
const val=id=>{const s=$(id).value.trim();if(s==='')return null;const x=Number(s);return isFinite(x)?x:null};
const fmt=(x,d)=>{const k=10**d;let s=(Math.round((x+Number.EPSILON*Math.sign(x))*k)/k).toLocaleString('en-US',{maximumFractionDigits:d});s=s.replace('-','−');return s==='−0'?'0':s};
const f=x=>fmt(x,4), pf=x=>(x<0?'−':'')+'₱'+fmt(Math.abs(x),2);
const t=(c,s)=>' '+(c<0?'−':'+')+' '+f(Math.abs(c))+s;
const S=(title,...l)=>'<div class="step"><h3>'+title+'</h3>'+l.flat().map(L=>L[0]==='>'?'<div class="res">'+L.slice(1)+'</div>':L[0]==='#'?'<div class="note">'+L.slice(1)+'</div>':'<div class="eq">'+L+'</div>').join('')+'</div>';
const chg=(o,n)=>n===o?'No change needed.':(n>o?'Increase':'Decrease')+' = '+pf(Math.abs(n-o))+' per unit';
const lab=p=>p>=0?'profit':'loss';

/* ---------- graph ---------- */
function chart(TR,TC,xmax,pts){
  const W=640,H=320,L=64,R=18,T=26,B=40,n=120;
  let ymax=0;
  for(let i=0;i<=n;i++){const x=xmax*i/n;ymax=Math.max(ymax,TR(x),TC(x))}
  const nice=m=>{const e=10**Math.floor(Math.log10(m)),k=m/e;return(k<=1?1:k<=2?2:k<=5?5:10)*e};
  const ys=nice((ymax||1)/4);ymax=ys*Math.ceil((ymax||1)/ys);
  const xs=nice(xmax/5);
  const X=x=>L+(W-L-R)*x/xmax,Y=y=>H-B-(H-B-T)*y/ymax;
  const path=g=>{let s='';for(let i=0;i<=n;i++){const x=xmax*i/n;s+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(g(x)).toFixed(1)}return s};
  let o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Total revenue and total cost graph">';
  for(let y=0;y<=ymax+1e-9;y+=ys)o+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(y)+'" y2="'+Y(y)+'"/><text x="'+(L-6)+'" y="'+(Y(y)+4)+'" text-anchor="end">'+f(y)+'</text>';
  for(let x=0;x<=xmax+1e-9;x+=xs)o+='<text x="'+X(x)+'" y="'+(H-B+16)+'" text-anchor="middle">'+f(x)+'</text>';
  o+='<text x="'+(W/2)+'" y="'+(H-6)+'" text-anchor="middle">Units sold (x)</text>';
  o+='<path class="ln trl" d="'+path(TR)+'"/><path class="ln tcl" d="'+path(TC)+'"/>';
  o+='<line x1="'+L+'" x2="'+(L+22)+'" y1="12" y2="12" class="ln trl"/><text x="'+(L+28)+'" y="16">TR</text><line x1="'+(L+60)+'" x2="'+(L+82)+'" y1="12" y2="12" class="ln tcl"/><text x="'+(L+88)+'" y="16">TC</text>';
  pts.forEach(p=>{const cx=X(p.x),cy=Y(p.y),a=cx>W-110?'end':'start';o+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="var(--acc)"/><text x="'+(cx+(a==='end'?-8:8))+'" y="'+(cy-8)+'" text-anchor="'+a+'" style="fill:var(--ink);font-weight:600">('+f(p.x)+', '+f(p.y)+')</text>'});
  $('chart').innerHTML=o+'</svg>';$('gcard').hidden=false;
}

/* ---------- linear ---------- */
function linear(){
  const p=val('lp'),v=val('lv'),F=val('lf'),u=val('lu'),T=val('lt'),N=val('ln');
  if(p===null||v===null||F===null){$('out').innerHTML='<p class="msg">Enter the selling price, variable cost per unit, and fixed cost to see the solution.</p>';$('gcard').hidden=true;return}
  const m=p-v;let h='';
  h+=S('Given','Selling price per unit (SP) = '+pf(p),'Variable cost per unit (VC) = '+pf(v),'Fixed cost (FC) = '+pf(F),'Contribution per unit = SP − VC = '+f(p)+' − '+f(v)+' = '+pf(m),'#Let x = number of units sold.');
  h+=S('1. TR, TC, and profit functions','TR = SP · x = '+f(p)+'x','VC = '+f(v)+'x','TC = VC + FC = '+f(v)+'x + '+f(F),'P = TR − TC = '+f(p)+'x − ('+f(v)+'x + '+f(F)+')','>P = '+f(m)+'x − '+f(F));
  let bx=null;
  if(m>0){
    bx=F/m;
    h+=S('2. Break-even quantity and revenue','At break-even, TR = TC',f(p)+'x = '+f(v)+'x + '+f(F),f(p)+'x − '+f(v)+'x = '+f(F),f(m)+'x = '+f(F),'x = '+f(F)+' ÷ '+f(m),'>Break-even quantity = '+f(bx)+' units','TR = '+f(p)+'('+f(bx)+')','>Break-even revenue = '+pf(p*bx),Number.isInteger(bx)?'':'#Not a whole number, so in practice sell '+f(Math.ceil(bx))+' units to reach break-even.','#Selling fewer than '+f(bx)+' units gives a loss; selling more gives a profit.');
  }else h+=S('2. Break-even quantity and revenue','Contribution per unit = '+pf(m),'#The contribution per unit is zero or negative, so revenue never catches up with cost. There is no break-even point.');
  if(p>0)h+=S('3. Units needed to cover the fixed cost','Set TR = FC',f(p)+'x = '+f(F),'x = '+f(F)+' ÷ '+f(p),'>x = '+f(F/p)+' units');
  if(u!==null){const P=m*u-F;h+=S('4. Profit when sales are '+f(u)+' units','P = '+f(m)+'x − '+f(F),'P = '+f(m)+'('+f(u)+') − '+f(F),'P = '+f(m*u)+' − '+f(F),'>P = '+pf(P)+' ('+lab(P)+')',P<0?'#A negative profit means a loss.':'')}
  if(T!==null){
    if(m>0){const x=(T+F)/m;h+=S('5. Sales volume when profit is '+pf(T),'Use P = '+f(m)+'x − '+f(F),f(T)+' = '+f(m)+'x − '+f(F),f(T)+' + '+f(F)+' = '+f(m)+'x',f(T+F)+' = '+f(m)+'x','x = '+f(T+F)+' ÷ '+f(m),'>x = '+f(x)+' units','#Check: revenue '+pf(p*x)+' − total cost '+pf(v*x+F)+' = '+pf(p*x-v*x-F))}
    else h+=S('5. Sales volume for the target profit','#Not possible: the contribution per unit is zero or negative.');
  }
  if(N!==null&&N>0){
    const yv=(p*N-F)/N,ys=(v*N+F)/N,nf=m*N;
    h+=S('6a. New variable cost to break even at '+f(N)+' units','Let y = new VC per unit. SP and FC stay the same.','TR = '+f(p)+'('+f(N)+') = '+pf(p*N),'TC = '+f(N)+'y + '+f(F),'TR = TC → '+f(p*N)+' = '+f(N)+'y + '+f(F),f(p*N-F)+' = '+f(N)+'y','y = '+f(p*N-F)+' ÷ '+f(N),'>New VC = '+pf(yv)+' per unit','Original VC = '+pf(v)+', so '+chg(v,yv).toLowerCase());
    h+=S('6b. New selling price to break even at '+f(N)+' units','Let y = new SP per unit. VC and FC stay the same.','TC = '+f(v)+'('+f(N)+') + '+f(F)+' = '+pf(v*N+F),'TR = '+f(N)+'y','TR = TC → '+f(N)+'y = '+f(v*N+F),'y = '+f(v*N+F)+' ÷ '+f(N),'>New SP = '+pf(ys)+' per unit','Original SP = '+pf(p)+', so '+chg(p,ys).toLowerCase());
    h+=S('6c. New fixed cost to break even at '+f(N)+' units','Let F′ = new fixed cost. SP and VC stay the same.','TR = '+f(p)+'('+f(N)+') = '+pf(p*N),'VC = '+f(v)+'('+f(N)+') = '+pf(v*N),'TR = VC + F′ → '+f(p*N)+' = '+f(v*N)+' + F′','F′ = '+f(p*N)+' − '+f(v*N),'>New FC = '+pf(nf),'Original FC = '+pf(F)+', so '+(nf===F?'no change needed.':(nf>F?'increase':'decrease')+' = '+pf(Math.abs(nf-F))));
  }
  $('out').innerHTML=h;
  const xmax=Math.max(bx!==null?bx*2:0,u||0,N||0,10);
  chart(x=>p*x,x=>v*x+F,xmax,bx!==null?[{x:bx,y:p*bx}]:[]);
}

/* ---------- non-linear ---------- */
function roots(p,q){const D=p*p-4*q;if(D<0)return{D,r:[]};const s=Math.sqrt(D);return{D,s,r:D===0?[p/2]:[(p-s)/2,(p+s)/2]}}
function nonlinear(){
  const a=val('na'),b=val('nb'),v=val('nv'),F=val('nf'),u=val('nu'),T=val('nt');
  if(a===null||b===null||v===null||F===null){$('out').innerHTML='<p class="msg">Enter the starting price, price drop per unit sold, variable cost, and fixed cost to see the solution.</p>';$('gcard').hidden=true;return}
  if(b<=0){$('out').innerHTML='<p class="msg">The price drop per unit sold (b) must be greater than 0. For a constant price, use the Linear tab.</p>';$('gcard').hidden=true;return}
  const B=a-v,p=B/b,q=F/b;
  const P=x=>-b*x*x+B*x-F, TR=x=>a*x-b*x*x;
  const Pstr='−'+f(b)+'x²'+t(B,'x')+t(-F,'');
  let h='';
  h+=S('Given','Starting price = '+pf(a)+', decreasing by '+pf(b)+' for every unit sold','VC = '+pf(v)+' per unit, FC = '+pf(F),'#Let x = number of units sold.');
  h+=S('1. New selling price per unit','Price = '+f(a)+' − '+f(b)+'x');
  h+=S('2. TR, TC, and profit functions','TR = (price)(x) = ('+f(a)+' − '+f(b)+'x)x','>TR = '+f(a)+'x − '+f(b)+'x²','>TC = '+f(v)+'x + '+f(F),'P = TR − TC = ('+f(a)+'x − '+f(b)+'x²) − ('+f(v)+'x + '+f(F)+')','>P = '+Pstr);
  const R=roots(p,q);
  const std='x²'+t(-p,'x')+t(q,'')+' = 0';
  let s3=['At break-even, P = 0',Pstr+' = 0','Multiply both sides by −1/b = '+f(-1/b)+' so the x² term has coefficient 1:',std,'Use the quadratic formula on x² − px + q = 0 with p = '+f(p)+' and q = '+f(q)+':','D = p² − 4q = ('+f(p)+')² − 4('+f(q)+') = '+f(R.D)];
  if(R.D<0){s3.push('>D is negative: no real solution','#The profit curve never reaches zero, so the firm never breaks even.')}
  else{
    s3.push('x = [p ± √D] ÷ 2 = ['+f(p)+' ± √'+f(R.D)+'] ÷ 2 = ['+f(p)+' ± '+f(R.s)+'] ÷ 2');
    if(R.D>0&&R.r.every(r=>Math.abs(r-Math.round(r))<1e-9))s3.push('#This also factors: (x − '+f(R.r[0])+')(x − '+f(R.r[1])+') = 0');
    R.r.forEach((r,i)=>s3.push('>'+(R.r.length>1?'x'+'₁₂'[i]:'x')+' = '+f(r)+' units'));
  }
  h+=S('3. Break-even quantity',s3);
  const pts=[];
  if(R.r.length){
    h+=S('4. Break-even revenue',R.r.map(r=>{pts.push({x:r,y:TR(r)});return ['If x = '+f(r)+': TR = '+f(a)+'('+f(r)+') − '+f(b)+'('+f(r)+')² = '+f(a*r)+' − '+f(b*r*r),'>TR = '+pf(TR(r))]}));
    if(R.r.length>1){const lo=R.r[0],hi=R.r[1],c=[];
      if(lo-1>=0)c.push('x = '+f(lo-1)+': P = '+pf(P(lo-1))+' ('+lab(P(lo-1))+')');
      c.push('x = '+f(hi+1)+': P = '+pf(P(hi+1))+' ('+lab(P(hi+1))+')');
      h+=S('5. Interpretation','>Break-even points: ('+f(lo)+', '+f(TR(lo))+') and ('+f(hi)+', '+f(TR(hi))+')','Selling fewer than '+f(lo)+' units or more than '+f(hi)+' units results in a loss. Between them, the firm earns a profit.','Check by substituting a point outside each break-even:',c)}
    else h+=S('5. Interpretation','#There is one break-even point. The firm never earns a profit above it, because the highest possible profit is zero.');
  }
  const xs=B/(2*b);
  if(xs>0)h+=S('6. Maximum profit','The profit curve opens downward, so its peak is at x = B ÷ 2b, where B = a − VC = '+f(B),'x = '+f(B)+' ÷ '+f(2*b)+' = '+f(xs)+' units','P = −'+f(b)+'('+f(xs)+')²'+t(B,'('+f(xs)+')')+t(-F,''),'>Maximum profit = '+pf(P(xs))+' at '+f(xs)+' units','#Selling more than this lowers profit because the price keeps dropping.');
  if(u!==null)h+=S('7. Profit when sales are '+f(u)+' units','P = '+Pstr,'P = −'+f(b)+'('+f(u)+')²'+t(B,'('+f(u)+')')+t(-F,''),'P = '+f(-b*u*u)+t(B*u,'')+t(-F,''),'>P = '+pf(P(u))+' ('+lab(P(u))+')',a-b*u<0?'#Warning: at this volume the formula gives a negative selling price.':'');
  if(T!==null){
    const q2=(F+T)/b,R2=roots(p,q2);
    let s=['Set P = '+f(T),Pstr+' = '+f(T),'Move '+f(T)+' to the left and multiply by −1/b = '+f(-1/b)+':','x²'+t(-p,'x')+t(q2,'')+' = 0','D = ('+f(p)+')² − 4('+f(q2)+') = '+f(R2.D)];
    if(R2.D<0)s.push('>No real solution','#This profit is never reached. The maximum profit is '+pf(P(xs))+'.');
    else{s.push('x = ['+f(p)+' ± √'+f(R2.D)+'] ÷ 2');R2.r.forEach((r,i)=>s.push('>'+(R2.r.length>1?'x'+'₁₂'[i]:'x')+' = '+f(r)+' units'));if(R2.r.length>1)s.push('#The target profit is earned at both volumes; the lower one needs less stock.')}
    h+=S('8. Sales volume when profit is '+pf(T),s);
  }
  $('out').innerHTML=h;
  chart(TR,x=>v*x+F,a/b,pts);
}

/* ---------- wiring ---------- */
let mode=1;
const run=()=>mode===1?linear():nonlinear();
function tab(n){mode=n;$('p1').hidden=n!==1;$('p2').hidden=n!==2;$('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2);run()}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',run));
document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{$(b.dataset.clear).querySelectorAll('input').forEach(i=>i.value='');run()});
run();
</script>
</body>
</html>
